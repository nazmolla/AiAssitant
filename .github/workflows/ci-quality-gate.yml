name: CI Quality Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-quality-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, Test, Audit
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies (deterministic)
        run: npm ci

      - name: Lint
        run: npm run lint -- --max-warnings 0

      - name: Unit/Integration/Component Tests
        run: npx jest --forceExit

      - name: Vulnerability Audit (high+)
        # Audit at high+ severity. Two moderate nodemailer CVEs (GHSA-c7w3-x93f-qmm8,
        # GHSA-vvjj-xcjg-gr5g) are accepted: fixing them via --force downgrades next-auth
        # to a legacy version with critical babel-traverse/passport CVEs — net worse outcome.
        # Track at: https://github.com/nazmolla/AiAssitant/issues/286
        run: npm audit --audit-level=high
